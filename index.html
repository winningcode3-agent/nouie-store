<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Yon lyen envitasyon (oswa rekiperasyon modpas) Supabase rive ak
      // `#access_token=...&type=invite` nan URL la. Kliyan supabase-js la li l
      // epi li efase l nan bwat adrès la tousuit — donk si nou pa make l ISIT,
      // anvan tout lòt script, nou pèdi enfòmasyon an epi moun nan ap tonbe sou
      // paj akèy la san janm chwazi yon modpas.
      try {
        if (/type=(invite|recovery)/.test(location.hash || '')) {
          sessionStorage.setItem('nouie_mande_modpas', '1')
        }
      } catch (e) { /* mòd prive: nou kontinye san mak la */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>NOUIE | Technical Streetwear</title>
    <meta name="description" content="NOUIE — evolution of streetwear through technical precision and architectural symmetry. Limited seasonal drops, shipped worldwide." />

    <link rel="canonical" href="https://no-uie.com/" />

    <!-- Open Graph / Twitter: se sa ki bay tit, deskripsyon ak imaj lè yon moun
         pataje lyen an sou Instagram, WhatsApp oswa nan yon mesaj. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOUIE" />
    <meta property="og:title" content="NOUIE | Technical Streetwear" />
    <meta property="og:description" content="Evolution of streetwear through technical precision and architectural symmetry. Limited seasonal drops, shipped worldwide." />
    <meta property="og:url" content="https://no-uie.com/" />
    <meta property="og:image" content="https://no-uie.com/assets/home_cover_collage.jpg" />
    <meta property="og:image:alt" content="NOUIE seasonal collection" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOUIE | Technical Streetwear" />
    <meta name="twitter:description" content="Evolution of streetwear through technical precision and architectural symmetry." />
    <meta name="twitter:image" content="https://no-uie.com/assets/home_cover_collage.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
